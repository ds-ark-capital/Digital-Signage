<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signage</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      transition: opacity var(--transition, 1.5s) ease-in-out;
    }
    .slide.active { opacity: 1; }
    .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <script>
    (async () => {
      const root = document.body;

      function showError(msg) {
        const div = document.createElement("div");
        div.className = "error";
        div.textContent = msg;
        root.appendChild(div);
        console.error(msg);
      }

      let manifest;
      try {
        // Cache-bust so MTRs always get the latest manifest
        const res = await fetch("manifest.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        manifest = await res.json();
      } catch (e) {
        showError("Failed to load manifest.json — " + e.message);
        return;
      }

      const slidesCfg = Array.isArray(manifest.slides) ? manifest.slides : [];
      if (slidesCfg.length === 0) {
        showError("No slides defined in manifest.json");
        return;
      }

      const defaultDuration = manifest.defaultDurationMs || 10000;
      const transitionMs = manifest.transitionMs || 1500;
      const fit = manifest.fit === "cover" ? "cover" : "contain";

      document.documentElement.style.setProperty("--transition", transitionMs + "ms");

      // Build slide elements
      const slides = slidesCfg.map((cfg, i) => {
        const isVideo = cfg.type === "video";
        const el = isVideo ? document.createElement("video") : document.createElement("img");
        el.src = cfg.src;
        el.className = "slide" + (i === 0 ? " active" : "");
        el.style.objectFit = fit;

        if (isVideo) {
          el.muted = true;
          el.playsInline = true;
          el.loop = false;
          el.onerror = () => console.warn("Failed to load video:", cfg.src);
        } else {
          el.onerror = () => console.warn("Failed to load image:", cfg.src);
        }

        root.appendChild(el);
        return { el, duration: cfg.durationMs || defaultDuration, isVideo };
      });

      // Cycle
      let current = 0;

      function showSlide(index) {
        const slide = slides[index];
        slide.el.classList.add("active");
        if (slide.isVideo) {
          slide.el.currentTime = 0;
          slide.el.play().catch(() => {});
          if (slide.duration) {
            setTimeout(nextSlide, slide.duration);
          } else {
            slide.el.addEventListener("ended", nextSlide, { once: true });
          }
        } else {
          setTimeout(nextSlide, slide.duration);
        }
      }

      function nextSlide() {
        const prev = slides[current];
        prev.el.classList.remove("active");
        if (prev.isVideo) prev.el.pause();
        current = (current + 1) % slides.length;
        showSlide(current);
      }

      showSlide(current);

      // Auto-refresh manifest every 5 minutes so MTRs pick up changes
      // without needing the signage session to restart.
      setInterval(async () => {
        try {
          const res = await fetch("manifest.json?t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) return;
          const fresh = await res.json();
          const oldKey = JSON.stringify(slidesCfg);
          const newKey = JSON.stringify(fresh.slides || []);
          if (oldKey !== newKey) {
            // Reload the page to rebuild slideshow cleanly
            location.reload();
          }
        } catch (_) { /* ignore transient errors */ }
      }, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
